<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Gravity</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky">
    <div class="sky-day"></div>
    <div class="sky-sunset"></div>
    <div class="sky-twilight"></div>
    <div class="sky-night"></div>
    <div class="starfield"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="bird bird-1">🕊️</div>
    <div class="bird bird-2">🕊️</div>
    <div class="bird bird-3">🐦</div>
    <div class="owl">🦉</div>
    <div class="bat bat-1">🦇</div>
    <div class="bat bat-2">🦇</div>
    <div class="bat bat-3">🦇</div>
  </div>

  <input type="checkbox" id="dark-toggle" hidden />

  <h1 class="title">🌌 Solar Gravity 🌌</h1>

  <div class="planet p-mercury"></div>
  <div class="planet p-venus"></div>
  <div class="planet p-earth"></div>
  <div class="planet p-mars"></div>
  <div class="planet p-jupiter"></div>
  <div class="planet p-saturn"></div>
  <div class="planet p-uranus"></div>
  <div class="planet p-neptune"></div>

  <label for="dark-toggle" class="sun" title="Toggle night mode">
    <span class="sun-disc"></span>
    <span class="moon"></span>
  </label>

  <footer class="footer">Made by sworddao, demonx-sage, UjjenTamrakar &amp; yashaswikarmacharya10-rgb</footer>

  <script src="script.js"></script>
</body>
</html>
