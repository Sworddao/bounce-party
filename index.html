<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bounce Party!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">🎉 Welcome to Bounce Party! 🎉</h1>
  <p class="subtitle">Turn on Party Mode and let the fun begin!</p>

  <div class="stage">
    <div class="ball ball-1">😀</div>
    <div class="ball ball-2">🤖</div>
    <div class="ball ball-3">🐸</div>
    <div class="ball ball-4">🦄</div>
    <div class="ball ball-5">🍕</div>
    <div class="ball ball-6">🚀</div>
    <div class="ball ball-7">🐙</div>
    <div class="ball ball-8">🌈</div>
  </div>

  <div class="controls">
    <label class="switch">
      <input type="checkbox" checked />
      <span class="slider"></span>
    </label>
    <span class="label-text">Party mode</span>
  </div>

  <div class="confetti">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

    <div class="party-stats">
    <span>🎈 8 Bouncing Balls</span>
    <span>🎊 10 Confetti Pieces</span>
    <span>✨ Party Mode Ready</span>
  </div>

  <footer class="footer">Made by sworddao, demonx-sage, UjjenTamrakar &amp; yashaswikarmacharya10-rgb</footer>
</body>
</html>
