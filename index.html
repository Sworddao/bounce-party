<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Party!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dark Mode Toggle -->
    <input type="checkbox" id="dark-toggle" hidden>

    <label for="dark-toggle" class="dark-btn">🌙 Dark Mode</label>

    <h1 class="title">🚀 Space Bounce Party 🚀</h1>

    <div class="stage">
        <div class="ball ball-1">🌍</div>
        <div class="ball ball-2">🪐</div>
        <div class="ball ball-3">☄️</div>
        <div class="ball ball-4">🌙</div>
        <div class="ball ball-5">⭐</div>
        <div class="ball ball-6">👨‍🚀</div>
        <div class="ball ball-7">🚀</div>
        <div class="ball ball-8">🛰️</div>
    </div>

    <div class="controls">
        <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>
        <span class="label-text">Party Mode</span>
    </div>

    <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <footer class="footer">
        Made by sworddao, demonx-sage, UjjenTamrakar &amp;
        <strong>yashaswikarmacharya10-rgb</strong>
    </footer>

</body>
</html>
