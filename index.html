<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Party!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sky">
        <label for="dark-toggle" class="sun" title="Toggle night mode"></label>
        <div class="starfield"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="bird bird-1">🕊️</div>
        <div class="bird bird-2">🕊️</div>
        <div class="bird bird-3">🐦</div>
    </div>

    <!-- Night Mode Toggle -->
    <input type="checkbox" id="dark-toggle" hidden>

    <h1 class="title">🚀 Space Bounce Party 🚀</h1>
    <div class="aura-badge">aura +67 🔥</div>
    <p class="subtitle">
        This party hits different, no cap 🔥
    </p>

    <div class="stage">
        <div class="ball ball-1">🌍</div>
        <div class="ball ball-2">🪐</div>
        <div class="ball ball-3">☄️</div>
        <div class="ball ball-4">🌙</div>
        <div class="ball ball-5">⭐</div>
        <div class="ball ball-6">👨‍🚀</div>
        <div class="ball ball-7">🚀</div>
        <div class="ball ball-8">🛰️</div>
    </div>

    <div class="controls">
        <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>
        <span class="label-text">Party Mode</span>
    </div>

    <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <footer class="footer">
        Made by sworddao, demonx-sage, UjjenTamrakar &amp;
        <strong>yashaswikarmacharya10-rgb</strong>
    </footer>

</body>
</html>
