<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Bounce Party!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky">
    <div class="starfield"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="bird bird-1">🕊️</div>
    <div class="bird bird-2">🕊️</div>
    <div class="bird bird-3">🐦</div>
    <div class="owl">🦉</div>
    <div class="bat bat-1">🦇</div>
    <div class="bat bat-2">🦇</div>
    <div class="bat bat-3">🦇</div>
  </div>

  <input type="checkbox" id="dark-toggle" hidden />

  <div class="planet day p-mercury"></div>
  <div class="planet night p-mercury"></div>
  <div class="planet day p-venus"></div>
  <div class="planet night p-venus"></div>
  <div class="planet day p-earth"></div>
  <div class="planet night p-earth"></div>
  <div class="planet day p-mars"></div>
  <div class="planet night p-mars"></div>
  <div class="planet day p-jupiter"></div>
  <div class="planet night p-jupiter"></div>
  <div class="planet day p-saturn"></div>
  <div class="planet night p-saturn"></div>
  <div class="planet day p-uranus"></div>
  <div class="planet night p-uranus"></div>
  <div class="planet day p-neptune"></div>
  <div class="planet night p-neptune"></div>

  <label for="dark-toggle" class="sun" title="Toggle night mode"></label>
</body>
</html>
